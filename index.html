<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상진의 방 헌팅 보고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet"></noscript>
<style>
/* VOICE  로케이션 담당이 감독에게 회차별로 이어 내는 헌팅 보고서. 차분하고 촘촘하게
   IDEA   헌팅 바인더: 왼쪽 색인(목차) + 장소마다 한 장(사진·의견·시안·배치)
   PICTURE 첫 화면 = 1순위 포천 침실의 헌팅 사진 ↔ 밤 시안 비교
   COLOUR 짙은 밤 바탕, 종이빛 글씨, 달빛 파랑 강조, 벽지 세이지 보조, 산호색은 1순위 번호에만
   TYPE   Noto Serif KR(제목) + IBM Plex Sans KR(본문)
   LAYOUT 노트북: 왼쪽 고정 목차 + 본문. 휴대폰: 위 회차 줄, 아래 오른쪽 '목차' 단추 */
:root{color-scheme:dark;--bg:#0d1114;--side:#0a0d10;--panel:#141a1f;--panel2:#1a2229;--line:#26313a;--ink:#e9ecee;--soft:#cdd5da;--mute:#97a3ac;--moon:#b9d1ff;--sage:#9fb59b;--mark:#ff6f52;--barh:57px}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:auto}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.72 "IBM Plex Sans KR",system-ui,sans-serif;overflow-x:clip;word-break:keep-all;overflow-wrap:break-word;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
img{max-width:100%;display:block}
a{color:var(--moon)}
h1,h2,h3,h4{font-family:"Noto Serif KR",serif;letter-spacing:-.02em;line-height:1.28;margin:0;text-wrap:balance}
h2{font-size:clamp(25px,2.6vw,33px)}
h3{font-size:clamp(21px,2vw,25px)}
h4{font-size:18px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--moon);outline-offset:2px}
/* 상단 줄 */
.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px max(2vw,16px);min-height:var(--barh);background:#0a0d10;border-bottom:1px solid var(--line)}
.bar .t{font-family:"Noto Serif KR",serif;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .t small{font-family:"IBM Plex Sans KR";font-weight:400;color:var(--mute);font-size:13.5px;margin-left:8px}
.rounds{display:flex;gap:6px;margin-left:auto;align-items:center;flex:none}
.rnd{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer;min-height:36px;white-space:nowrap}
.rnd[aria-current=true]{background:var(--moon);color:#0d1114;border-color:var(--moon);font-weight:600}
.rnd.next{opacity:.55;cursor:default}
.upd{color:var(--mute);font-size:13px;white-space:nowrap;flex:none}
/* 틀 */
.shell{display:grid;grid-template-columns:272px minmax(0,1fr)}
@media(max-width:1000px){.shell{grid-template-columns:minmax(0,1fr)}}
aside.toc{position:sticky;top:var(--barh);height:calc(100vh - var(--barh));overflow-y:auto;background:var(--side);border-right:1px solid var(--line);padding:14px 12px 28px;display:flex;flex-direction:column}
@media(max-width:1000px){aside.toc{display:none}}
.tocin{flex:1}
.toc .grp,#toc2 .grp{color:var(--mute);font-size:12.5px;letter-spacing:.02em;margin:18px 8px 6px}
.toc .grp:first-child,#toc2 .grp:first-child{margin-top:4px}
.toc a.lk,#toc2 a.lk{display:flex;gap:9px;align-items:center;color:var(--soft);text-decoration:none;padding:7px 9px;border-radius:6px;font-size:15px;line-height:1.35;margin:1px 0}
.toc a.lk:hover,#toc2 a.lk:hover{background:var(--panel)}
.toc a.lk.on,#toc2 a.lk.on{background:var(--panel2);color:var(--ink);box-shadow:inset 3px 0 0 var(--moon)}
.no{flex:none;width:23px;height:23px;border-radius:5px;background:var(--mark);color:#1a0c08;font-weight:600;font-size:13px;display:grid;place-items:center;line-height:1}
.no.s2{background:var(--sage);color:#0f1a10}
.toc .dot,#toc2 .dot{flex:none;width:23px;text-align:center;color:var(--mute)}
.drivebtn{display:flex;align-items:center;gap:10px;margin:18px 2px 0;padding:11px 12px;border:1px solid #33465a;border-radius:8px;background:#121b24;color:var(--ink);text-decoration:none;font-size:14.5px;line-height:1.35}
.drivebtn:hover{border-color:var(--moon)}
.drivebtn .ic{flex:none;width:28px;height:28px;border-radius:6px;background:var(--moon);color:#0d1114;display:grid;place-items:center;font-weight:700}
.drivebtn small{display:block;color:var(--mute);font-size:12.5px}
main{padding:0 max(3.5vw,16px) 80px;max-width:1200px}
section.sec{padding:44px 0 12px;border-bottom:1px solid var(--line)}
.kicker{color:var(--sage);font-size:14px;font-weight:600;margin-bottom:6px;letter-spacing:.01em}
.lead{color:var(--soft);max-width:780px;margin:12px 0 0}
/* 드라이브 안내 */
.drive{display:flex;align-items:center;gap:14px;margin-top:22px;padding:13px 16px;border:1px solid #33465a;border-left:3px solid var(--moon);border-radius:8px;background:#111a22;color:var(--ink);text-decoration:none}
.drive:hover{border-color:var(--moon)}
.drive .ic{flex:none;width:34px;height:34px;border-radius:7px;background:var(--moon);color:#0d1114;display:grid;place-items:center;font-weight:700;font-size:17px}
.drive .tx{flex:1;font-size:15.5px;line-height:1.5}
.drive .tx small{display:block;color:var(--mute);font-size:13.5px}
.drive .go{flex:none;color:var(--moon);font-weight:600;white-space:nowrap}
/* 비교 사진 */
.ba{position:relative;overflow:hidden;border-radius:6px;background:#000;aspect-ratio:16/9;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.ba.r43{aspect-ratio:4/3}
.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ba .after{clip-path:inset(0 0 0 var(--x,50%))}
.ba .ln{position:absolute;top:0;bottom:0;left:var(--x,50%);width:2px;background:var(--moon);transform:translateX(-1px);pointer-events:none}
.ba .kn{position:absolute;top:50%;left:var(--x,50%);width:44px;height:44px;border-radius:50%;background:var(--moon);color:#0d1114;transform:translate(-50%,-50%);display:grid;place-items:center;font-weight:700;pointer-events:none;box-shadow:0 2px 10px rgba(0,0,0,.45)}
.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.ba .lb{position:absolute;bottom:10px;padding:3px 9px;border-radius:4px;background:rgba(0,0,0,.66);font-size:13px;pointer-events:none;line-height:1.5}
.ba .l1{left:10px}.ba .l2{right:10px}
.cap{color:var(--mute);font-size:14px;margin-top:8px;line-height:1.6}
/* 크게 보기 단추 */
.zwrap{position:relative}
.zbtn{position:absolute;top:8px;right:8px;z-index:6;border:1px solid rgba(255,255,255,.18);background:rgba(10,13,16,.78);color:var(--ink);border-radius:6px;padding:4px 10px;font-size:13px;line-height:1.5;cursor:zoom-in;min-height:32px}
.zbtn:hover{background:rgba(10,13,16,.95);border-color:var(--moon)}
/* 한눈에 */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;margin-top:22px;align-items:start}
@media(max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.box p{margin:0;color:var(--soft)}
.box+.box{margin-top:12px}
.box b{color:var(--ink)}
.facts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.facts li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:8px;font-size:15px}
.facts li:last-child{border-bottom:0;padding-bottom:0}
.facts li span{color:var(--mute)}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.pick{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);text-align:left;cursor:pointer;padding:0;text-decoration:none;color:var(--ink);display:block}
.pick img{aspect-ratio:4/3;object-fit:cover;width:100%}
.pick .n{position:absolute;left:6px;top:6px;background:var(--mark);color:#1a0c08;font-weight:600;border-radius:4px;padding:0 7px;font-size:13px}
.pick .n.s2{background:var(--sage);color:#0f1a10}
.pick .nm{padding:8px 10px;font-size:14.5px;line-height:1.4}
.pick:hover{border-color:#3c4a55}
.pickh{margin:22px 0 0;color:var(--mute);font-size:14px}
/* 의도 */
.cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:start;margin-top:20px}
@media(max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.plan{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px}
.plan svg{width:100%;height:auto;display:block}
ul.cond{list-style:none;padding:0;margin:0;display:grid;gap:12px}
ul.cond li{border-left:2px solid var(--sage);padding:2px 0 2px 14px;color:var(--soft)}
ul.cond b{display:block;color:var(--ink);font-weight:600}
/* 장소 한 장 */
article.place{padding:44px 0 34px;border-top:1px solid var(--line)}
article.place.first{border-top:0}
.ph{display:flex;gap:14px;align-items:flex-start}
.bigno{flex:none;width:52px;height:52px;border-radius:8px;background:var(--mark);color:#1a0c08;font:700 26px/52px "Noto Serif KR",serif;text-align:center}
.bigno.s2{background:var(--sage);color:#0f1a10}
.ph .ar{color:var(--mute);font-size:14.5px;margin-top:4px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.tag{font-size:13px;line-height:1.55;border-radius:4px;padding:1px 8px;background:var(--panel2);color:#c9d2d8;white-space:nowrap}
.tag.a3{background:#3a2a20;color:#f2c9a8}.tag.a2{background:#2a3227;color:#c9dbc4}.tag.a1{background:#22303d;color:#bcd4ee}
.tag.w2{background:#203048;color:var(--moon)}.tag.new{background:var(--mark);color:#1a0c08}
.verdict{margin:18px 0 0;padding:13px 18px;border-left:3px solid var(--moon);background:var(--panel);border-radius:0 6px 6px 0;font-size:17px;line-height:1.65}
.mosaic{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:repeat(2,minmax(0,1fr));gap:6px;margin-top:16px;aspect-ratio:2.2/1}
.mosaic button{padding:0;border:0;background:#000 center/cover no-repeat;border-radius:5px;overflow:hidden;cursor:zoom-in;position:relative}
.mosaic button:first-child{grid-row:1/3}
.mosaic img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.mosaic button:hover img{transform:scale(1.03)}
.mosaic .more{position:absolute;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;font-weight:600}
@media(max-width:600px){.mosaic{grid-template-columns:1fr 1fr;grid-template-rows:auto;aspect-ratio:auto}.mosaic button:first-child{grid-column:1/3;grid-row:auto;aspect-ratio:16/10}.mosaic button{aspect-ratio:4/3}.mosaic button:nth-child(n+4){display:none}.mosaic button:nth-child(3) .more{display:grid}}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:18px;align-items:stretch}
@media(max-width:760px){.two{grid-template-columns:minmax(0,1fr)}}
.two .box+.box{margin-top:0}
.two .box h4{font-family:"IBM Plex Sans KR";font-size:15px;color:var(--sage);margin-bottom:6px}
.sub{margin:32px 0 12px;display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap}
.sub h4{font-size:19px}
.sub p{margin:0;color:var(--mute);font-size:14.5px}
.cases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:stretch}
@media(max-width:860px){.cases{grid-template-columns:minmax(0,1fr)}}
.case{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.case .media{position:relative;aspect-ratio:16/9;background:#000}
.case .media>.ba,.case .media>.sweep,.case .media>.strip,.case .media>img{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;border-radius:0}
.case .media>img{object-fit:cover}
.case .cb{padding:13px 15px 15px;flex:1}
.case .ct{display:flex;gap:6px 8px;align-items:baseline;flex-wrap:wrap}
.case .ct b{font-size:16.5px;line-height:1.45}
.wh{font-size:13px;line-height:1.55;color:#0d1114;background:var(--sage);border-radius:4px;padding:0 7px;white-space:nowrap}
.case p{margin:8px 0 0;color:var(--soft);font-size:15.5px;line-height:1.68}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;background:#000}
.strip img{width:100%;height:100%;object-fit:cover}
/* 배치도 */
.planarea{display:block}
.planarea svg{width:100%;height:auto;display:block}
.layout{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:center}
@media(max-width:700px){.layout{grid-template-columns:minmax(0,1fr)}}
.layout svg{width:100%;height:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.alts{display:grid;gap:8px}
.alt{display:flex;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;color:var(--soft);font-size:15.5px}
.alt .ab{flex:none;width:24px;height:24px;border-radius:5px;background:var(--panel2);color:var(--moon);font-weight:700;display:grid;place-items:center;font-size:13px}
.chg{margin-top:14px}
svg [data-open]{cursor:pointer}
.place .next{margin-top:26px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.place .next a{color:var(--soft);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:9px 13px;font-size:14.5px}
.place .next a:hover{border-color:var(--moon);color:var(--ink)}
/* 거르기 · 카드 */
.filters{display:grid;gap:8px;margin:18px 0 6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
.frow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.frow>span{color:var(--mute);font-size:14px;width:60px;flex:none}
.seg{border:1px solid var(--line);background:transparent;border-radius:6px;padding:6px 11px;font-size:14px;cursor:pointer;min-height:38px}
.seg[aria-pressed=true]{background:var(--moon);color:#0d1114;border-color:var(--moon);font-weight:600}
.count{color:var(--mute);font-size:14px;margin:6px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px;margin-top:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column}
.card:hover{border-color:#3c4a55}
.card .im{aspect-ratio:3/2;background:#000;position:relative}
.card .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .pc{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.68);border-radius:4px;padding:1px 7px;font-size:12.5px}
.card .tx{padding:12px 14px 14px;display:grid;gap:6px;align-content:start}
.card h4{font-size:17px;line-height:1.38}
.card .ar{color:var(--mute);font-size:13.5px}
.card .one{font-size:14.5px;color:var(--soft);margin:0;line-height:1.62}
.empty{padding:22px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:8px;margin-top:14px}
/* 공통 장치 */
.dev{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;padding:26px 0;border-top:1px solid var(--line);align-items:start}
.dev:first-of-type{border-top:0}
@media(max-width:860px){.dev{grid-template-columns:minmax(0,1fr)}}
.dev p{color:var(--soft);margin:8px 0 0}
.dev .seen{font-size:14px;color:var(--mute);margin-top:10px}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:14px}
.mini figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;position:relative}
.mini figure{padding-top:48px}
@media(pointer:coarse){.mini figure{padding-top:60px}}
.mini svg{width:100%;height:auto;display:block}
.mini figcaption{font-size:14.5px;color:var(--soft);margin-top:8px;line-height:1.6}
/* 표 */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;margin-top:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:500;cursor:pointer;white-space:nowrap;user-select:none;font-size:14px}
th[aria-sort]::after{content:" ▾";color:var(--moon)}
th[aria-sort=ascending]::after{content:" ▴"}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panel)}
td.nm{font-weight:600}
@media(max-width:600px){.stack thead{display:none}.stack tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}.stack td{display:block;border:0;padding:0;font-size:13.5px;color:var(--soft)}.stack td::before{content:attr(data-l) " ";color:var(--mute)}.stack td.nm{grid-column:1/-1;font-size:15.5px;color:var(--ink)}.stack td.nm::before{content:""}.stack td[data-l="순위 번호"],.stack td[data-l="사진"]{display:none}}
/* 기록 */
.log{display:grid;gap:12px;margin-top:16px}
.log .box h4{font-family:"IBM Plex Sans KR";font-size:16px}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:14px}
footer{color:var(--mute);font-size:14px;padding:30px 0}
/* 목차 단추(휴대폰) */
.fab{position:fixed;right:16px;bottom:18px;z-index:40;background:var(--moon);color:#0d1114;border:0;border-radius:999px;padding:12px 20px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.5);cursor:pointer;display:none;min-height:48px}
@media(max-width:1000px){.fab{display:block}}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:none}
.sheet.on{display:block}
.sheet .in{position:absolute;left:0;right:0;bottom:0;max-height:82vh;overflow-y:auto;background:var(--side);border-top:1px solid var(--line);border-radius:14px 14px 0 0;padding:12px 14px 28px}
.sheet .hd{position:sticky;top:-12px;background:var(--side);padding:10px 0 6px;z-index:2;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;gap:10px}
.sheet .hd small{color:var(--mute);font-size:12.5px;font-weight:400;display:block}
.x{border:1px solid var(--line);background:var(--panel);border-radius:6px;min-width:44px;min-height:44px;font-size:20px;cursor:pointer}
/* 사진 보기 */
.lbx{position:fixed;inset:0;z-index:80;background:#06080a;display:none;overflow-y:auto}
.lbx.on{display:block}
.lbx .in{max-width:1240px;margin:0 auto;padding:10px max(3vw,12px) 40px}
.lbx .hd{display:flex;gap:12px;align-items:center;justify-content:space-between;position:sticky;top:0;background:#06080a;padding:8px 0;z-index:2}
.stage{position:relative;background:#000;border-radius:6px;overflow:hidden;touch-action:pan-y;height:min(70vh,58vw,760px);cursor:grab;user-select:none;-webkit-user-select:none}
.stage:active{cursor:grabbing}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;-webkit-user-drag:none;pointer-events:none}
@media(max-width:600px){.stage{height:min(62vh,82vw)}}

 <div class="kicker">1·2순위 밖 · 추가 후보</div><h2>추가 후보</h2>
 <p class="lead xlead">1·2순위만큼 조건이 다 맞지는 않지만, 한 장면에 꼭 맞거나 미술로 메우면 충분히 쓸 수 있는 곳입니다. 1·2순위 답사 결과에 따라 바로 꺼내 볼 수 있도록 같은 기준(노후감·문과 창·문 밖 깊이·조명 자리)으로 정리했습니다. 카드를 누르면 사진과 의견이 열립니다.</p>

 <p class="lead xlead">직접 가 보기 전에 로케이션 사이트(필름메이커스·아워플레이스·스페이스클라우드·로케이션마켓·쉐어잇·필름코리아)와 영상위원회 자료를 한 곳씩 넘겨 보며 추린 곳입니다. 게시물 사진만으로 상진의 방 조건을 다시 따져, 바로 답사해 볼 곳은 <b>데스크헌팅 추천 1</b>, 조건이 맞으면 볼 곳은 <b>추천 2</b>로 나눴습니다(보고서의 1·2순위와는 별개). 사진은 게시물 일부만 옮겼고, 카드 안 링크에서 전체를 보실 수 있습니다.</p>

</section>

 <div class="kicker">더 보기</div><h2>깨끗한·스튜디오형</h2>
 <p class="lead">구조는 좋지만 깨끗하거나 스튜디오로 꾸며진 곳입니다. 노후감은 미술로 더해야 합니다.</p>
 <div id="g-clean"></div>
</section>
<section class="sec" id="devices">
 <div class="kicker">공통</div><h2>모든 후보에 쓰는 연출 장치</h2>
 <p class="lead">장소와 상관없이 쓰는 방법입니다. 장치마다 <b>예시로 만든 공간</b>과 <b>특히 잘 맞는 후보</b>를 적었습니다.</p>
 <div class="dev"><div><div class="ba" style="--x:50%"><img src="viz/yc_paper.jpg" alt="낮" loading="lazy"><img class="after" src="viz/yc_night.jpg" alt="밤" loading="lazy"><div class="ln"></div><div class="kn">⇆</div><span class="lb l1">낮</span><span class="lb l2">밤</span><input type="range" min="0" max="100" value="50" aria-label="달빛 비교"></div></div><div><h3>달빛 하드라이트</h3><p>창밖 멀리 큰 조명 하나를 두면 그림자가 평행하고 선명해져 달빛으로 읽힙니다. 창 앞에 실제 나뭇가지를 세우면 벽에 가지 그림자가 흔들립니다. 《오아시스》에서 공주가 벽에 비친 나뭇가지 그림자를 무서워하던 것과 같은 장치입니다.</p><p class="seen">예시 공간: 연천 HID 빈방 · 잘 맞는 곳: 포천, 연천, 경자네(방범창), 강화(격자창)</p></div></div>
 <div class="dev"><div><div class="sweep"><img src="viz/pc_dark.jpg" alt="어두운 포천 침실"><img class="lit" src="viz/pc_before.jpg" alt=""></div><div class="cap">움직이는 시안 — 빛 띠가 방을 훑고 지나갑니다.</div></div><div><h3>등대처럼 훑는 빛</h3><p>창밖 조명을 천천히 돌려 빛 띠가 방을 가로질러 지나가게 합니다. 빛이 지날 때만 방이 보입니다.</p><p class="seen">예시 공간: 포천 침실 · 잘 맞는 곳: 창밖에 조명이 움직일 마당이 있는 포천, 연천, 웅도, 강화</p></div></div>
 <div class="dev"><div><div class="pass"><img src="viz/yc_night.jpg" alt="달빛 든 연천 빈방"><svg class="who" viewBox="0 0 100 160" aria-hidden="true"><ellipse cx="50" cy="30" rx="18" ry="22"/><path d="M28 50h44l26 50v60H2v-60z"/></svg></div><div class="cap">움직이는 시안 — 달빛 앞을 사람이 지나가면 벽에 그림자가 스칩니다.</div></div><div><h3>창밖을 지나는 사촌(3씬)</h3><p>1층이면 실제로 창밖을 걷게 하고, 달빛 앞을 지나는 순간 벽에 큰 그림자가 스칩니다. 2층 집은 이 그림자만으로 같은 장면을 만듭니다.</p><p class="seen">예시 공간: 연천 HID 빈방 · 그림자로 풀 곳: 청주, 일산 빌라, 의정부 610-5</p></div></div>
 <div class="dev"><div><div class="ba" style="--x:50%"><img src="viz/hall_before.jpg" alt="헌팅 사진" loading="lazy"><img class="after" src="viz/hall_night.jpg" alt="1·8씬" loading="lazy"><div class="ln"></div><div class="kn">⇆</div><span class="lb l1">헌팅 사진</span><span class="lb l2">1·8씬</span><input type="range" min="0" max="100" value="50" aria-label="복도 비교"></div></div><div><h3>1·8씬 — 방만 빛나고 나머지는 어둠</h3><p>방 밖 먼 곳에서 망원으로 당겨 열린 문 안의 방만 떠 보이게 합니다. 집마다 깊이를 만드는 방법이 달라서, 각 장소 시안에 그 집 버전을 따로 만들었습니다.</p><p class="seen">예시 공간: 연천 HID 복도 · 집별 버전: 포천 복도, 증산로 거실, 경자네 레이스 발, 웅도 툇마루, 강화 격자문</p></div></div>
